services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: researcher-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: researcher
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: researcher_pass
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d researcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    container_name: researcher-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=researcher
      - POSTGRES_PWD=researcher_pass
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: researcher-temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      - temporal

  worker:
    build: .
    container_name: researcher-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://researcher:researcher_pass@postgres:5432/researcher
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE_DEFAULT=car-research-queue
      - TEMPORAL_TASK_QUEUE_SCRAPERS=car-scraper-queue
      - SEARCH_ZIP_CODE=94103
      - SEARCH_RADIUS_MILES=60
      - SEARCH_MIN_PRICE=20000
      - SEARCH_MAX_PRICE=60000
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  pgdata:
